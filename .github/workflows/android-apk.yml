name: Build Android APK

# Roda ao publicar uma tag v* (ex: v1.0.0) ou manualmente pela aba Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Defina em Settings > Secrets and variables > Actions > Variables
      ZARKDROID_URL: ${{ vars.ZARKDROID_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar URL do site
        run: |
          if [ -z "$ZARKDROID_URL" ]; then
            echo "::error::Defina a variável ZARKDROID_URL (URL do deploy na Vercel) em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Apontar o app para o site publicado
        run: node -e "const f='capacitor.config.json';const c=require('./'+f);c.server.url=process.env.ZARKDROID_URL;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zarkdroid.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" zarkdroid.apk --clobber \
            || gh release create "$TAG" zarkdroid.apk --title "Zarkdroid $TAG" --notes "APK Android do Zarkdroid." --latest
